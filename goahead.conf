# > 地域测速
🇭🇰 香港节点 = url-test, policy-regex-filter=(🇭🇰)|(港)|(Hong)|(HK), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇹🇼 台湾节点 = url-test, policy-regex-filter=(🇹🇼)|(台)|(Tai)|(TW), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇯🇵 日本节点 = url-test, policy-regex-filter=(🇯🇵)|(日)|(Japan)|(JP), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇸🇬 狮城节点 = url-test, policy-regex-filter=(🇸🇬)|(新)|(Singapore)|(SG), policy-select-name=新加坡 | ZJ | 1, url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇺🇸 美国节点 = url-test, 美国1, 良心云, OK CLOUD, use=true, policy-regex-filter=(🇺🇸)|(美)|(States)|(US), policy-select-name=🇺🇸美国01|流媒体, url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇬🇧 英国节点 = url-test, policy-regex-filter=(🇬🇧)|(英)|(Kingdom)|(UK), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇲🇾 马来节点 = url-test, policy-regex-filter=(🇲🇾)|(马)|(Malaysia)|(MY), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50
🇺🇳 小众节点 = url-test, policy-regex-filter=(喀麦隆)|(冰岛)|(土耳其)|(阿根廷), url=http://www.gstatic.com/generate_204, interval=600, timeout=5, tolerance=50

# > 多地域组合
🗺️ Non-HK = url-test, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 🇬🇧 英国节点, 🇲🇾 马来节点, 🇺🇳 小众节点, tolerance=50
🌏 Asia = url-test, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇲🇾 马来节点, tolerance=50
🌎 Western = url-test, 🇺🇸 美国节点, 🇬🇧 英国节点, 🇺🇳 小众节点, tolerance=50

